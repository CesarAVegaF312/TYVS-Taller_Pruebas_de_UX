name: ambiente

# Verifica que el ambiente definido como codigo (.devcontainer y, si existe,
# docker-compose.yml) se construye y funciona. Corre cuando cambia algo del
# ambiente, y a mano desde la pestana Actions.
on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/ambiente.yml'
      - 'docker-compose.yml'
      - '**/Dockerfile'
      - 'playwright/playwright.config.js'
      - 'selenium-java/src/test/java/tests/DriverFactory.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devcontainer:
    name: Devcontainer se construye y la suite pasa adentro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: cd registraduria && mvn -B -DskipTests package && cd ../playwright && npx playwright test tests/modulo1-e2e.spec.js tests/modulo2-pom.spec.js tests/modulo3-accesibilidad.spec.js tests/modulo3b-defectos-sembrados.spec.js

  compose:
    name: Selenium contra el Grid y referencias visuales en Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: El archivo de compose es valido
        run: docker compose config -q
      - name: Levantar el ambiente
        run: docker compose up -d --build --wait
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Selenium con el navegador del contenedor
        run: mvn -B test -Dheadless=true -Dselenium.remote.url=http://localhost:4444 -Dbase.url=http://app:8080
        working-directory: selenium-java
      # Genera las referencias del modulo 4 en el contenedor oficial de
      # Playwright y las publica: se pueden descargar y versionar.
      - name: Referencias visuales en el contenedor de Playwright
        run: docker compose --profile visual run --rm playwright npx playwright test tests/modulo4-visual.spec.js --update-snapshots
      - name: Publicar referencias generadas
        uses: actions/upload-artifact@v4
        with:
          name: referencias-visuales-linux
          path: playwright/tests/modulo4-visual.spec.js-snapshots/*-linux.png
          if-no-files-found: error
      - name: Registros si algo fallo
        if: failure()
        run: docker compose logs --no-color
      - name: Apagar
        if: always()
        run: docker compose down -v

name: ambiente

# Verifica que el ambiente definido como codigo (.devcontainer y, si existe,
# docker-compose.yml) se construye y funciona. Corre cuando cambia algo del
# ambiente, y a mano desde la pestana Actions.
on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/ambiente.yml'
      - 'docker-compose.yml'
      - '**/Dockerfile'
      - 'playwright/playwright.config.js'
      - 'selenium-java/src/test/java/tests/DriverFactory.java'
      - 'playwright/tests/modulo4-visual.spec.js'
      - 'playwright/tests/modulo4-visual.spec.js-snapshots/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devcontainer:
    name: Devcontainer se construye y la suite pasa adentro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # La CLI oficial de devcontainers, con version fija y la salida guardada:
      # si algo falla, las lineas de error se publican como anotaciones del
      # check, visibles en el PR sin abrir el log completo.
      - name: Construir el devcontainer
        run: |
          set -o pipefail
          npx -y @devcontainers/cli@0.89.0 up --workspace-folder . 2>&1 | tee construccion.log
      - name: Correr la suite dentro del devcontainer
        run: |
          set -o pipefail
          npx -y @devcontainers/cli@0.89.0 exec --workspace-folder . bash -lc "cd registraduria && mvn -B -DskipTests package && cd ../playwright && npx playwright test tests/modulo1-e2e.spec.js tests/modulo2-pom.spec.js tests/modulo3-accesibilidad.spec.js tests/modulo3b-defectos-sembrados.spec.js" 2>&1 | tee suite.log
      - name: Mostrar el error en el PR
        if: failure()
        run: |
          for f in construccion.log suite.log; do
            [ -f "$f" ] && grep -v '^\s*$' "$f" | grep -i -E 'error|fail|unable|denied|not found|E: ' | tail -n 15 | while IFS= read -r l; do echo "::error title=$f::${l:0:900}"; done
          done
          true

  compose:
    name: Selenium contra el Grid y referencias visuales en Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: El archivo de compose es valido
        run: docker compose config -q
      - name: Levantar el ambiente
        run: docker compose up -d --build --wait
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Selenium con el navegador del contenedor
        run: mvn -B test -Dheadless=true -Dselenium.remote.url=http://localhost:4444 -Dbase.url=http://app:8080
        working-directory: selenium-java
      # Regresion visual de verdad: compara contra las referencias -linux
      # versionadas, generadas en este mismo contenedor. Para regenerarlas,
      # etiqueta "actualizar-referencias" en el PR (referencias-visuales.yml).
      - name: Regresion visual (modulo 4) en el contenedor de Playwright
        run: docker compose --profile visual run --rm playwright npx playwright test tests/modulo4-visual.spec.js
      - name: Publicar las diferencias si la comparacion falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diferencias-visuales
          path: playwright/test-results/
          if-no-files-found: ignore
      - name: Registros si algo fallo
        if: failure()
        run: docker compose logs --no-color
      - name: Apagar
        if: always()
        run: docker compose down -v

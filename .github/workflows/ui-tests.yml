name: pruebas-ui

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# El GITHUB_TOKEN es de solo lectura por defecto en los repositorios creados
# desde 2023. Sin este bloque, cualquier accion que publique un check o un
# comentario falla con "Resource not accessible by integration".
permissions:
  contents: read
  checks: write

jobs:
  playwright:
    name: Playwright (E2E + accesibilidad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar el sistema bajo prueba
        run: mvn -B -DskipTests clean package
        working-directory: registraduria

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: playwright

      - name: Instalar navegador
        run: npx playwright install chromium --with-deps
        working-directory: playwright

      # El bloque webServer de playwright.config.js levanta la Registraduria
      # y espera a /actuator/health antes de empezar. No hace falta arrancarla
      # en un paso aparte.
      #
      # Se excluye el modulo 4 (regresion visual) a proposito: las capturas de
      # referencia se generaron en la maquina del estudiante y dependen del
      # sistema operativo y de las fuentes instaladas, asi que no coinciden con
      # las de un runner Linux. En un proyecto real se generarian dentro del
      # contenedor oficial de Playwright.
      - name: Ejecutar pruebas
        run: npx playwright test tests/modulo1-e2e.spec.js tests/modulo2-pom.spec.js tests/modulo3-accesibilidad.spec.js
        working-directory: playwright
        env:
          CI: true

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 7

  selenium:
    name: Selenium (UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar el sistema bajo prueba
        run: mvn -B -DskipTests clean package
        working-directory: registraduria

      # Selenium NO levanta la aplicacion por su cuenta: hay que arrancarla
      # y esperar a que responda. Un "sleep 30" fijo aqui es una fuente
      # clasica de pruebas inestables.
      - name: Levantar la Registraduria
        run: |
          nohup java -jar target/registraduria-1.0-SNAPSHOT.jar > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Servicio arriba"; exit 0
            fi
            sleep 2
          done
          echo "El servicio no arranco a tiempo"; cat /tmp/app.log; exit 1
        working-directory: registraduria

      - name: Ejecutar pruebas
        run: mvn -B test -Dheadless=true
        working-directory: selenium-java

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-surefire-reports
          path: selenium-java/target/surefire-reports/
          retention-days: 7
